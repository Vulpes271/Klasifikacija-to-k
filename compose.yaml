name: klasifikacija
services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-models:/root/.ollama
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: 5m
      OLLAMA_NUM_PARALLEL: 1
      OLLAMA_CONTEXT_LENGTH: 4096
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    # No host port is published. The Python container uses the internal network.
  app:
    build: .
    profiles: ["tools"]
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    volumes:
      - ./data:/app/data
      - ./results:/app/results
      - ./configs:/app/configs:ro
    depends_on:
      ollama:
        condition: service_healthy
volumes:
  ollama-models:
